[project]
name = "bqae-toolkit"
version = "0.1.0"
description = "CLI tools for dbt development with BigQuery: schema generation, profiling, and more"
authors = [
    { name = "Padraig Alton" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "google-cloud-bigquery>=3.40.1",
    "cyclopts>=4.10.1",
    "ruamel.yaml>=0.19.1",
    "sqlglot>=30.1.0",
]

[project.scripts]
dbt-schema-builder = "dbt_schema_builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_schema_builder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "COM812",
    "D203",
    "D205",
    "D212",
    "D400",
    "D415",
    "FBT",
    "INP001",
    "RET504",
    "PTH110",
    "PTH113",
    "PTH123",
    "PTH207",
    "S603",
    "S605",
    "S607",
    "S608",
    "SIM103",
    "T201",
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ALL",
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ty.environment]
python-version = "3.14"
